<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pointless Websites</title>
    <meta name="description" content="Pointless Websites — a small collection of useless little websites.">
    <meta property="og:title" content="Pointless Websites">
    <meta property="og:description" content="a small collection of useless little websites">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://pointless-websites.com/">
    <meta name="theme-color" content="#ffffff">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100%;
            padding: 24px;
            text-align: center;
            font-family: "EB Garamond", Georgia, "Times New Roman", serif;
            color: #1a1a1a;
            background: #ffffff;
            -webkit-font-smoothing: antialiased;
        }
        h1 {
            font-weight: 500;
            font-size: clamp(2.2rem, 8vw, 3.6rem);
            letter-spacing: 0.01em;
            line-height: 1.05;
        }
        .tagline {
            margin-top: 10px;
            font-style: italic;
            font-size: clamp(1rem, 3.4vw, 1.25rem);
            color: #6b6b6b;
        }
        ul.sites {
            list-style: none;
            margin: 56px 0 0;
            padding: 0;
            font-size: clamp(1.05rem, 2.6vw, 1.2rem);
        }
        ul.sites li { margin: 14px 0; }
        ul.sites a {
            color: #1a1a1a;
            text-decoration: none;
            border-bottom: 1px solid #d8d8d8;
            padding-bottom: 2px;
            transition: border-color 0.15s ease;
        }
        ul.sites a:hover { border-bottom-color: #1a1a1a; }
        ul.sites em { color: #6b6b6b; font-size: 0.9em; margin-left: 6px; }
        @media (prefers-color-scheme: dark) {
            body { color: #e8e8e8; background: #111111; }
            .tagline { color: #a8a8aa; }
            ul.sites a { color: #e8e8e8; border-bottom-color: #333; }
            ul.sites a:hover { border-bottom-color: #e8e8e8; }
            ul.sites em { color: #a8a8aa; }
        }
    </style>
</head>
<body>
    <main>
        <h1>Pointless Websites</h1>
        <p class="tagline">a small collection of useless little websites</p>
        <ul class="sites">
            <li><a href="/no-exit/">No Exit</a><em>— Sartre</em></li>
            <li><a href="/brutalist/">Béton Brut</a><em>— raw concrete</em></li>
        </ul>
    </main>
</body>
</html>
