<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Finding My Door</title>
    <meta name="description" content="Directions to my apartment gate for delivery drivers.">
    <meta name="theme-color" content="#ffffff">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            display: flex;
            justify-content: center;
            min-height: 100%;
            padding: 28px 18px 40px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            color: #1a1a1a;
            background: #ffffff;
            -webkit-font-smoothing: antialiased;
        }
        main { width: 100%; max-width: 520px; }
        h1 {
            font-weight: 700;
            font-size: 1.5rem;
            margin-bottom: 10px;
            letter-spacing: -0.01em;
        }
        .address {
            font-size: 1.05rem;
            line-height: 1.5;
            margin-bottom: 14px;
        }
        .address strong { font-weight: 700; }
        .map-links {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
        }
        .map-links a {
            flex: 1;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            color: #fff;
            background: #1a1a1a;
            text-decoration: none;
            border-radius: 10px;
            padding: 10px 8px;
        }
        .photo-card {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 12px;
            background: #000;
            line-height: 0;
        }
        .photo-card img { display: block; width: 100%; height: auto; }
        .photo-card svg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }
        .key-facts {
            font-size: 1.05rem;
            line-height: 1.6;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .footer {
            margin-top: 18px;
            font-size: 0.95rem;
            color: #6b6b6b;
        }
        @media (prefers-color-scheme: dark) {
            body { color: #e8e8e8; background: #111111; }
            .footer { color: #a8a8aa; }
            .map-links a { background: #e8e8e8; color: #111; }
        }
    </style>
</head>
<body>
    <main>
        <h1>Finding My Door</h1>
        <p class="address">
            <strong>Camden Tempe</strong> — 600 E Curry Rd, Tempe, AZ 85288<br>
            Unit G1105
        </p>

        <div class="map-links">
            <a href="https://maps.google.com/?q=600+E+Curry+Rd,+Tempe,+AZ+85288" target="_blank" rel="noopener">Google Maps →</a>
            <a href="https://maps.apple.com/?address=600%20E%20Curry%20Rd,%20Tempe,%20AZ%2085288" target="_blank" rel="noopener">Apple Maps →</a>
        </div>

        <div class="photo-card">
            <img src="images/close-satellite.jpg" alt="Satellite photo with the drive from Curry Rd to the gate marked in blue">
            <svg viewBox="0 0 1206 2050" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="603" cy="1276" r="40" fill="none" stroke="#ffd400" stroke-width="8"/>
                <text x="380" y="1290" text-anchor="end" font-family="-apple-system, sans-serif" font-size="40" font-weight="700" fill="#111" stroke="#ffd400" stroke-width="6" paint-order="stroke">GATE</text>
            </svg>
        </div>

        <p class="key-facts">Enter from Curry Rd. Gate is about halfway up the drive — keypad faces Scottsdale Rd.</p>

        <div class="footer">No code? Text me.</div>
    </main>
</body>
</html>
